[package]
name = "ytmusic-native"
version = "0.1.0"
edition = "2021"
description = "Fully native YouTube Music client (Rust + egui), no web engine while playing"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "system_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4"] }
ureq = "3"
serde_json = "1"
sha1 = "0.11"
# Only used by the one-time `--login` window.
wry = "0.57"
tao = "0.37"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
